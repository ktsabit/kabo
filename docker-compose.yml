services:
  cambio:
    image: cambio-activity:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      CLIENT_DIST: /app/client/dist
      ALLOW_GUESTS: ${ALLOW_GUESTS:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
