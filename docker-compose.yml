services:
  cambio:
    image: kabo:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
        VITE_BUILD_VERSION: ${VITE_BUILD_VERSION:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      CLIENT_DIST: /app/client/dist
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_REGISTER_COMMANDS: ${DISCORD_REGISTER_COMMANDS:-false}
      ALLOW_GUESTS: ${ALLOW_GUESTS:-false}
      DB_PATH: ${DB_PATH:-/data/kabo.sqlite}
      KABO_TURN_TIMEOUT: ${KABO_TURN_TIMEOUT:-15s}
      KABO_REVEAL_TIMEOUT: ${KABO_REVEAL_TIMEOUT:-3s}
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      pangolin:
        aliases:
          - kabo-app


networks:
  pangolin:
    external: true
